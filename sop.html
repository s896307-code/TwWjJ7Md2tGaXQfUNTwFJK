<style>
  :root{
    --bg:#F5F2EA;
    --surface:#FFFFFF;
    --surface-2:#ECE6D6;
    --ink:#182338;
    --ink-muted:#5C6577;
    --line:#DDD5BE;
    --line-strong:#C7BC9C;
    --brand:#0B6D74;
    --brand-ink:#FFFFFF;
    --brand-tint:#E3F1EF;
    --sev-crit:#A6291F;
    --sev-crit-tint:#F7E4E1;
    --sev-mid:#96600A;
    --sev-mid-tint:#F6EAD4;
    --sev-low:#276B44;
    --sev-low-tint:#E2EEE4;
    --sev-info:#3A5578;
    --sev-info-tint:#E7ECF3;
    --shadow: 0 1px 2px rgba(24,35,56,.06), 0 6px 20px -8px rgba(24,35,56,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161F;
      --surface:#171F2B;
      --surface-2:#1D2733;
      --ink:#E8EAEE;
      --ink-muted:#98A2B3;
      --line:#2B3644;
      --line-strong:#3A4756;
      --brand:#3FBFC4;
      --brand-ink:#08161A;
      --brand-tint:#123236;
      --sev-crit:#E88079;
      --sev-crit-tint:#3A2323;
      --sev-mid:#E0AD5C;
      --sev-mid-tint:#3A2F1C;
      --sev-low:#7FC79A;
      --sev-low-tint:#1E3327;
      --sev-info:#9FB4D6;
      --sev-info-tint:#20293A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161F;
    --surface:#171F2B;
    --surface-2:#1D2733;
    --ink:#E8EAEE;
    --ink-muted:#98A2B3;
    --line:#2B3644;
    --line-strong:#3A4756;
    --brand:#3FBFC4;
    --brand-ink:#08161A;
    --brand-tint:#123236;
    --sev-crit:#E88079;
    --sev-crit-tint:#3A2323;
    --sev-mid:#E0AD5C;
    --sev-mid-tint:#3A2F1C;
    --sev-low:#7FC79A;
    --sev-low-tint:#1E3327;
    --sev-info:#9FB4D6;
    --sev-info-tint:#20293A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px;}

  .masthead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    padding-bottom:22px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .masthead-title{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:clamp(26px,4vw,34px);
    letter-spacing:.01em;
    text-wrap:balance;
    margin:0 0 6px;
  }
  .masthead-sub{
    margin:0;
    color:var(--ink-muted);
    font-size:14.5px;
  }
  .masthead-mono{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    color:var(--ink-muted);
    text-align:right;
    line-height:1.7;
    white-space:nowrap;
  }
  .masthead-mono b{color:var(--ink);font-weight:600;}

  .notice{
    display:flex;
    gap:12px;
    background:var(--sev-mid-tint);
    border-left:3px solid var(--sev-mid);
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:28px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink);
  }
  .notice .mark{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-weight:700;
    color:var(--sev-mid);
    flex:none;
  }
  .notice b{color:var(--sev-mid);}

  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--surface-2);
    padding:4px;
    border-radius:9px;
    border:1px solid var(--line);
  }
  .tab-btn{
    font-family:'Noto Serif TC',serif;
    font-weight:600;
    font-size:14.5px;
    background:transparent;
    border:none;
    color:var(--ink-muted);
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn .count{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-weight:500;
    font-size:11.5px;
    opacity:.75;
    margin-left:4px;
  }
  .tab-btn[aria-selected="true"]{
    background:var(--surface);
    color:var(--brand);
    box-shadow:var(--shadow);
  }
  .tab-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .search{
    flex:1;
    min-width:180px;
    position:relative;
  }
  .search input{
    width:100%;
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
  }
  .search input:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
  .search svg{
    position:absolute;
    left:11px;top:50%;
    transform:translateY(-50%);
    stroke:var(--ink-muted);
    pointer-events:none;
  }

  .group-label{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:26px 2px 10px;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .item{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .item-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    color:var(--ink);
  }
  .item-head:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .idx{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13px;
    color:var(--brand);
    background:var(--brand-tint);
    border-radius:5px;
    padding:3px 7px;
    flex:none;
    min-width:30px;
    text-align:center;
  }
  .q-text{
    flex:1;
    font-size:15.5px;
    font-weight:500;
    line-height:1.5;
  }
  .chip{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
    flex:none;
    white-space:nowrap;
  }
  .chip.crit{background:var(--sev-crit-tint);color:var(--sev-crit);}
  .chip.mid{background:var(--sev-mid-tint);color:var(--sev-mid);}
  .chip.low{background:var(--sev-low-tint);color:var(--sev-low);}
  .chip.info{background:var(--sev-info-tint);color:var(--sev-info);}

  .chev{
    flex:none;
    width:18px;height:18px;
    stroke:var(--ink-muted);
    transition:transform .2s ease;
  }
  .item[data-open="true"] .chev{transform:rotate(180deg);}

  .item-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .22s ease;
  }
  .item[data-open="true"] .item-body{grid-template-rows:1fr;}
  .item-body-inner{overflow:hidden;}
  .item-content{
    padding:2px 16px 18px 60px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .steps{
    list-style:none;
    margin:0 0 14px;
    padding:0;
    counter-reset:step;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .steps li{
    counter-increment:step;
    position:relative;
    padding-left:26px;
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
  }
  .steps li::before{
    content:counter(step);
    position:absolute;
    left:0;top:1px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--brand);
    background:var(--brand-tint);
    width:18px;height:18px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .plain{font-size:14px;line-height:1.75;color:var(--ink);margin:0 0 12px;}
  .sublist{margin:0 0 12px;padding-left:20px;font-size:14px;line-height:1.8;color:var(--ink);}
  .sublist li{margin-bottom:4px;}
  .callout{
    display:flex;
    gap:9px;
    background:var(--sev-crit-tint);
    border-left:3px solid var(--sev-crit);
    border-radius:4px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    margin:0 0 14px;
  }
  .callout b{color:var(--sev-crit);}

  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 22px;
    padding-top:10px;
    border-top:1px dashed var(--line-strong);
  }
  .meta-pair{font-size:12.5px;line-height:1.6;}
  .meta-pair .k{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    color:var(--ink-muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:10.5px;
    display:block;
    margin-bottom:2px;
  }
  .meta-pair .v{color:var(--ink);font-weight:500;}
  .meta-pair .v.warn{color:var(--sev-mid);}
  .meta-pair .v.ok{color:var(--sev-low);}

  .empty{
    text-align:center;
    color:var(--ink-muted);
    font-size:14px;
    padding:40px 0;
  }

  footer{
    margin-top:36px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .item-body,.chev{transition:none;}
  }
</style>
</head>

const SEV_LABEL = { crit:'高', mid:'中', low:'低', info:'資訊' };

const listEl = document.getElementById('list');
const groupLabelEl = document.getElementById('groupLabel');
const emptyMsg = document.getElementById('emptyMsg');
const searchInput = document.getElementById('searchInput');
const tabBtns = document.querySelectorAll('.tab-btn');

let activeGroup = 'A';
let openIndex = -1; // index within currently rendered filtered list

function render(){
  const query = searchInput.value.trim().toLowerCase();
  const items = DATA
    .map((d, i) => ({...d, _i:i}))
    .filter(d => d.group === activeGroup)
    .filter(d => !query || d.q.toLowerCase().includes(query) ||
      (d.steps || []).some(s => s.toLowerCase().includes(query)) ||
      (d.sublist || []).some(s => s.toLowerCase().includes(query)));

  groupLabelEl.textContent = activeGroup === 'A'
    ? `A · 客戶操作指南（${items.length} 題）`
    : `B · 客服處理 SOP（${items.length} 題）`;

  listEl.innerHTML = '';
  emptyMsg.hidden = items.length !== 0;

  items.forEach((d, renderIdx) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.dataset.open = 'false';

    const head = document.createElement('button');
    head.className = 'item-head';
    head.setAttribute('aria-expanded', 'false');
    head.innerHTML = `
      <span class="idx">${String(renderIdx+1).padStart(2,'0')}</span>
      <span class="q-text">${d.q}</span>
      ${d.sev ? `<span class="chip ${d.sev}">${SEV_LABEL[d.sev]}</span>` : ''}
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    `;

    const body = document.createElement('div');
    body.className = 'item-body';

    let inner = '<div class="item-body-inner"><div class="item-content">';
    if (d.callout) {
      inner += `<div class="callout"><span>⚠</span><span>${d.callout}</span></div>`;
    }
    if (d.plain) {
      inner += `<p class="plain">${d.plain}</p>`;
    }
    if (d.steps) {
      inner += '<ol class="steps">' + d.steps.map(s => `<li>${s}</li>`).join('') + '</ol>';
    }
    if (d.sublist) {
      inner += '<ul class="sublist">' + d.sublist.map(s => `<li>${s}</li>`).join('') + '</ul>';
    }
    if (d.plain2) {
      inner += `<p class="plain" style="margin-bottom:0;">${d.plain2}</p>`;
    }
    if (d.meta) {
      inner += '<div class="meta">' + d.meta.map(([k,v,cls]) =>
        `<div class="meta-pair"><span class="k">${k}</span><span class="v${cls?' '+cls:''}">${v}</span></div>`
      ).join('') + '</div>';
    }
    inner += '</div></div>';
    body.innerHTML = inner;

    head.addEventListener('click', () => {
      const willOpen = item.dataset.open !== 'true';
      document.querySelectorAll('.item[data-open="true"]').forEach(el => {
        el.dataset.open = 'false';
        el.querySelector('.item-head').setAttribute('aria-expanded','false');
      });
      if (willOpen) {
        item.dataset.open = 'true';
        head.setAttribute('aria-expanded','true');
      }
    });

    item.appendChild(head);
    item.appendChild(body);
    listEl.appendChild(item);
  });
}

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.setAttribute('aria-selected', b === btn ? 'true' : 'false'));
    activeGroup = btn.dataset.group;
    render();
  });
});

searchInput.addEventListener('input', render);

render();
</script>
